<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scopa">
<meta name="theme-color" content="#E7E9E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Scopa Segnapunti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: each player is a playing card on a calm table; tap a card's button to log a scopa; one sheet at round end awards the four points. */
:root {
  --bg: #E7E9E4;          /* calm grey-green table */
  --card: #FFFFFF;        /* card face */
  --card-edge: #D3D7CF;
  --surface-2: #F0F2EE;
  --line: #D3D7CF;
  --ink: #1A1E1B;
  --ink-2: #545B56;
  --ink-3: #868D88;
  --accent: #1E4B39;      /* felt green for primary actions */
  --accent-ink: #FFFFFF;
  --warn: #9A5B00;
  /* player colours; the first four are the suit colours */
  --s1: #A8781A; --s2: #B0281F; --s3: #2B4F8C; --s4: #2F6E33; --s5: #7A3E78; --s6: #1F7A7A; --s7: #8A5A2B; --s8: #4A4F5A;
  --shadow: 4px 4px 0 rgb(30 40 32 / .16);
  --display: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --card: #1E2320; --card-edge: #2E3531; --surface-2: #272D29; --line: #313834;
    --ink: #EEF0EC; --ink-2: #B4BBB6; --ink-3: #7F8782;
    --accent: #6CC197; --accent-ink: #0D1511; --warn: #E7A64A;
    --s1: #E2B656; --s2: #EC6F63; --s3: #86A8E6; --s4: #7FC37B; --s5: #D193CE; --s6: #5CC4C4; --s7: #D19A62; --s8: #A3A9B5;
    --shadow: 4px 4px 0 rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --card: #1E2320; --card-edge: #2E3531; --surface-2: #272D29; --line: #313834;
  --ink: #EEF0EC; --ink-2: #B4BBB6; --ink-3: #7F8782;
  --accent: #6CC197; --accent-ink: #0D1511; --warn: #E7A64A;
  --s1: #E2B656; --s2: #EC6F63; --s3: #86A8E6; --s4: #7FC37B; --s5: #D193CE; --s6: #5CC4C4; --s7: #D19A62; --s8: #A3A9B5;
  --shadow: 4px 4px 0 rgb(0 0 0 / .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
button, .chip, select, a { touch-action: manipulation; }
body { margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)); padding-block: env(safe-area-inset-top, 0px) calc(92px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 8px; }
.top h1 { margin: 0; font: 700 32px/1 var(--display); letter-spacing: .02em; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-suits { display: inline-flex; gap: 4px; }
.brand-suits svg { width: 16px; height: 16px; }
.pixrule { height: 4px; margin-bottom: 14px; background: repeating-linear-gradient(90deg, var(--s1) 0 8px, transparent 8px 12px, var(--s2) 12px 20px, transparent 20px 24px, var(--s3) 24px 32px, transparent 32px 36px, var(--s4) 36px 44px, transparent 44px 48px); opacity: .8; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--card); }
.lang button { border: 0; background: none; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); }
.lang button.on { background: var(--ink); color: var(--card); }

.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 { margin: 0; font: 600 24px/1.15 var(--display); text-wrap: balance; }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.block { font-family: var(--display); letter-spacing: .02em; }
.btn.block { width: 100%; padding: 15px; font-size: 17px; border-radius: 14px; }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.danger { color: var(--s2); }
.swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }

.note { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--ink-2); }
.note p { margin: 0; flex: 1 1 200px; }

/* Playing cards */
.table { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px; }
.pcard {
  position: relative; background: var(--card); border: 2px solid var(--card-edge); border-radius: 6px; box-shadow: var(--shadow);
  aspect-ratio: 5 / 7.2; max-width: 100%; padding: 12px 12px 12px; display: flex; flex-direction: column; align-items: center; text-align: center;
  color: var(--ink);
}
.pcard.lead { border-color: var(--c); }
.crown { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); width: 26px; height: 16px; color: var(--c); }
.corner { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--c); line-height: 1; }
.corner b { font: 700 19px/1 var(--display); }
.corner svg { width: 14px; height: 14px; }
.corner.tl { top: 9px; left: 9px; }
.corner.br { bottom: 9px; right: 9px; transform: rotate(180deg); }
.pname { margin-top: 18px; font-weight: 600; font-size: 15px; max-width: 100%; padding-inline: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pscore { font: 600 60px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; margin-top: 4px; }
.pgoal { font-size: 12px; color: var(--ink-3); }
.pips { margin-top: auto; min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.pips .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pip { width: 16px; height: 16px; color: var(--c); display: block; }
.pip.new { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
.pips .num { font: 600 15px/1 var(--display); color: var(--c); }
.pact { width: 100%; display: flex; gap: 6px; margin-top: 8px; margin-bottom: 14px; }
.addscopa { flex: 1; min-width: 0; height: 48px; border: 0; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--display); box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 45%, var(--card)); font-weight: 700; font-size: 16px; background: color-mix(in srgb, var(--c) 14%, var(--card)); color: var(--ink); }
.addscopa:active { background: color-mix(in srgb, var(--c) 28%, var(--card)); transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 45%, var(--card)); }
.addscopa svg { width: 18px; height: 18px; color: var(--c); }
.undo { width: 40px; height: 48px; flex: none; border: 2px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink-2); font-size: 20px; line-height: 1; }
.undo:disabled { opacity: .35; }
.table.compact .pscore { font-size: 44px; }
.table.compact .pname { font-size: 14px; margin-top: 22px; padding-inline: 4px; }
.table.compact .addscopa { font-size: 14px; height: 44px; }
.table.compact .undo { width: 32px; height: 44px; }
.table.compact .pgoal { display: none; }
.table.compact .corner b { font-size: 16px; }

.winbox { background: var(--card); border-radius: 6px; box-shadow: var(--shadow); border: 2px solid var(--c); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.winbox .wincrown { width: 44px; height: 26px; color: var(--c); }
.winbox strong { font: 700 30px/1.1 var(--display); }
.winbox span { color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* History */
.hist { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.hist table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
.hist th, .hist td { padding: 10px 12px; text-align: center; white-space: nowrap; }
.hist th:first-child, .hist td:first-child { text-align: left; color: var(--ink-3); width: 1%; }
.hist thead th { font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.hist thead th span { display: inline-flex; align-items: center; gap: 5px; max-width: 7em; overflow: hidden; text-overflow: ellipsis; }
.hist tbody tr { cursor: pointer; }
.hist tbody tr + tr td { border-top: 1px solid var(--surface-2); }
.hist tbody tr:hover td { background: var(--surface-2); }
.hist td.zero { color: var(--ink-3); }
.hist td.edit { color: var(--ink-3); font-size: 13px; text-align: right; }
.hist tfoot td { border-top: 1px solid var(--line); font-weight: 700; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
.tabs button { border: 0; background: none; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--ink); }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }

/* Setup */
.field { display: flex; flex-direction: column; gap: 8px; }
.hint { font-size: 13px; color: var(--ink-3); margin: 0; }
.setup-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.colorbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--c); }
.colorbtn svg { width: 20px; height: 20px; }
.text { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 12px; font-size: 16px; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; color: var(--ink-3); font-size: 22px; line-height: 1; }
.iconbtn:disabled { opacity: .3; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; min-height: 42px; padding: 8px 14px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 7px; }
.chip.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
.chip.on .swatch { box-shadow: 0 0 0 2px var(--card); }
.chip.muted { color: var(--ink-2); font-weight: 500; }
.chip.muted.on { color: var(--card); }

/* End-of-round sheet */
.sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; }
.sheet-head { padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--card); }
.sheet-head > div { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-body { flex: 1; overflow-y: auto; }
.sheet-body > div { max-width: 560px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.sheet-foot { border-top: 1px solid var(--line); background: var(--card); padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.sheet-foot > div { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.preview { display: flex; gap: 6px; flex-wrap: wrap; }
.preview span { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--surface-2); }
.preview b { font-variant-numeric: tabular-nums; }
.open-hint { font-size: 13px; color: var(--warn); margin: 0; }

.cat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cat h3 { margin: 0; font: 600 20px/1.1 var(--display); }
.cat .sub { font-size: 13px; color: var(--ink-3); }
.cat-head > div { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
.link { border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; min-height: 46px; }
.row + .row { border-top: 1px solid var(--surface-2); }
.rname { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stepper button { width: 42px; height: 38px; border: 0; background: var(--surface-2); font-size: 20px; line-height: 1; }
.stepper output { min-width: 38px; text-align: center; font: 600 19px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; }

/* Primiera calculator */
.prim { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--surface-2); padding-top: 10px; }
.prim-side { display: flex; flex-direction: column; gap: 6px; }
.prim-top { display: flex; align-items: center; gap: 8px; }
.prim-total { font: 600 20px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
.prim-flag { font-size: 12px; color: var(--warn); font-weight: 600; }
.prim-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.suitsel { position: relative; }
.suitsel svg { position: absolute; left: 7px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); pointer-events: none; }
.suitsel select { width: 100%; appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 10px; height: 40px; padding: 0 2px 0 26px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.suitsel select.empty { color: var(--ink-3); font-weight: 500; }
.prim-key { font-size: 12px; color: var(--ink-3); margin: 0; }
.confirm { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }

/* Rules */
.rules { display: flex; flex-direction: column; gap: 22px; }
.rules section { display: flex; flex-direction: column; gap: 8px; }
.rules h3 { margin: 0; font: 600 22px/1.15 var(--display); }
.rules p { margin: 0; max-width: 65ch; color: var(--ink-2); }
.rules p b, .rules li b { color: var(--ink); }
.rules ul { margin: 0; padding-left: 20px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.lede { font: 500 18px/1.45 var(--body); color: var(--ink) !important; }
.suitlist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.suitlist div { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--c); }
.suitlist svg { width: 24px; height: 24px; flex: none; color: var(--c); }
.suitlist p { margin: 0; }
.suitlist b { display: block; font: 600 17px/1.1 var(--display); color: var(--ink); }
.suitlist span { font-size: 13px; color: var(--ink-3); }
.tbl { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; vertical-align: top; }
.tbl thead th { font-size: 12px; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--line); }
.tbl tbody tr + tr td { border-top: 1px solid var(--surface-2); }
.tbl td:first-child { font-weight: 600; white-space: nowrap; }
.tbl em { font-family: var(--display); font-weight: 600; }
.cards { display: flex; gap: 6px; flex-wrap: wrap; }
.mini { width: 44px; border: 1px solid var(--card-edge); background: var(--card); border-radius: 7px; padding: 6px 0 5px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: var(--shadow); }
.mini b { font: 700 16px/1 var(--display); }
.mini span { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.example { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.example b { color: var(--ink); }

@media (prefers-reduced-motion: reduce) { .pip.new { animation: none; } }
</style>
</head>
<body>

<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Scopa</h1><span class="brand-suits" aria-hidden="true"><svg style="color:var(--s1)"><use href="#i-denari"/></svg><svg style="color:var(--s2)"><use href="#i-coppe"/></svg><svg style="color:var(--s3)"><use href="#i-spade"/></svg><svg style="color:var(--s4)"><use href="#i-bastoni"/></svg></span></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-de" data-act="lang" data-v="de">DE</button>
      <button id="lang-en" data-act="lang" data-v="en">EN</button>
    </div>
  </header>
  <div class="pixrule" aria-hidden="true"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Main">
  <div>
    <button id="tab-game" data-act="tab" data-v="game"><svg><use href="#i-table"/></svg><span id="tab-game-l"></span></button>
    <button id="tab-rules" data-act="tab" data-v="rules"><svg><use href="#i-book"/></svg><span id="tab-rules-l"></span></button>
  </div>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
const KEY = 'scopa-tracker-v2';
const SUITS = ['denari', 'coppe', 'spade', 'bastoni'];
const COLORS = 8;
const PRIM_CARDS = [ [21, '7'], [18, '6'], [16, 'A'], [15, '5'], [14, '4'], [13, '3'], [12, '2'], [10, 'F'] ];
const CATS = ['carte', 'denari', 'settebello', 'primiera'];

/* pixel-art icons: X = filled pixel */
const PIX = {

    '....XX....',
    '....XX....',
    '....XX....',
    '..XXXXXX..',
    '.XXXXXXXX.'],
  spade: [
    '....XX....',
    '....XX....',
    '....XX....',
    '....XX....',
    '....XX....',
    '....XX....',
    '.XXXXXXXX.',
    '....XX....',
    '....XX....',
    '...XXXX...'],
  bastoni: [
    '......XXXX',
    '.....XXXXX',
    '....XXX.XX',
    '....XXXXX.',
    '...XXXX...',
    '..XXX.....',
    '.XXX......',
    'XXX.......',
    'XX........',
    'X.........'],
  broom: [
    '........XX',
    '.......XX.',
    '......XX..',
    '.....XX...',
    '..XXXX....',
    '.XXXXXX...',
    'XXXXXXX...',
    'XX.XXX....',
    'XXX.X.....',
    'X.X.......'],

/* ---------- state ---------- */
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.sides ? s : null; } catch { return null; } }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

const blankRound = (n, scope) => ({ scope: scope ? scope.slice() : Array(n).fill(0), carte: null, denari: null, settebello: null, primiera: null });

function sampleState(lang) {
  const r = (scope, carte, denari, settebello, primiera) => ({ scope, carte, denari, settebello, primiera });
  return {
    lang, example: true, target: 11,
    sides: [ { name: 'Giulia', color: 0 }, { name: 'Marco', color: 1 }, { name: 'Lena', color: 2 }, { name: 'Paolo', color: 3 } ],
    rounds: [
      r([1, 0, 0, 1], 0, 0, 1, 0),
      r([0, 2, 0, 0], 1, 'tie', 3, 1),
      r([0, 0, 1, 0], 'tie', 2, 0, 2),
    ],
    live: [0, 1, 0, 0],
  };
}

const defaultLang = (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
let S = load() || sampleState(defaultLang);
const ui = { tab: 'game', setup: null, draft: null, editIndex: null, confirmDel: false, calc: null, popIdx: -1 };
const t = () => T[S.lang] || T.de;

/* ---------- scoring (pure) ---------- */
function scoreRound(r, n) {
  const pts = r.scope.slice(0, n);
  while (pts.length < n) pts.push(0);
  for (const k of CATS) if (typeof r[k] === 'number') pts[r[k]] += 1;
  return pts;
}

function primiera(cards) {
  const prim = cards.map(row => ({ sum: row.reduce((a, v) => a + v, 0), complete: row.every(v => v > 0), touched: row.some(v => v > 0) }));
  const elig = prim.map((p, i) => p.complete ? i : -1).filter(i => i >= 0);
  let winner = null;
  if (elig.length) {
    const max = Math.max(...elig.map(i => prim[i].sum));
    const top = elig.filter(i => prim[i].sum === max);
    winner = top.length === 1 ? top[0] : 'tie';
  }
  return { prim, winner };
}

function totals() {
  const n = S.sides.length;
  return S.rounds.reduce((acc, r) => { scoreRound(r, n).forEach((p, i) => acc[i] += p); return acc; }, Array(n).fill(0));
}

function gameResult(tot) {
  const max = Math.max(...tot);
  if (max < S.target) return null;
  const top = tot.map((v, i) => v === max ? i : -1).filter(i => i >= 0);
  return top.length === 1 ? { winner: top[0] } : { tie: top };
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const colIdx = i => (S.sides[i]?.color ?? i) % COLORS;
const col = i => `var(--s${colIdx(i) + 1})`;
const suitOf = i => SUITS[colIdx(i) % 4];
const nameOf = i => S.sides[i].name || t().namePh(i + 1);
const icon = id => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
const sw = c => `<span class="swatch" style="--c:${c}"></span>`;
const initial = s => (s.trim()[0] || '?').toUpperCase();

/* ---------- views ---------- */
function gameView() {
  const L = t();
  const tot = totals();
  const res = gameResult(tot);
  const n = S.sides.length;
  const max = Math.max(...tot);
  const leaders = tot.filter(v => v === max).length;
  const cols = n <= 2 || n === 4 ? 2 : 3;
  const over = res?.winner != null;
  let html = '<div class="stack">';

  if (S.example) html += `<div class="note"><p>${L.example}</p><button class="btn primary" data-act="new-game">${L.newGame}</button></div>`;

  if (over) {
    html += `<div class="winbox" style="--c:${col(res.winner)}"><svg class="wincrown" aria-hidden="true"><use href="#i-crown"/></svg><strong>${esc(L.wins(nameOf(res.winner)))}</strong><span>${tot.join(' : ')}</span>
      <button class="btn primary" data-act="rematch">${L.rematch}</button></div>`;
  } else if (res?.tie) {
    html += `<div class="note"><p>${esc(L.tieTop(res.tie.map(nameOf).join(', ')))}</p></div>`;
  }

  html += `<div class="meta"><span class="eyebrow">${L.roundN(S.rounds.length + (over ? 0 : 1))}</span><span class="eyebrow">${L.playTo(S.target)}</span></div>`;

  html += `<div class="table ${cols === 3 ? 'compact' : ''}" style="--cols:${cols}">` + S.sides.map((s, i) => {
    const sc = S.live[i] || 0;
    const pips = sc === 0 ? '' : sc <= 6
      ? Array.from({ length: sc }, (_, k) => `<svg class="pip ${k === sc - 1 && ui.popIdx === i ? 'new' : ''}" aria-hidden="true"><use href="#i-broom"/></svg>`).join('')
      : `<svg class="pip" aria-hidden="true"><use href="#i-broom"/></svg><span class="num">× ${sc}</span>`;
    return `
    <div class="pcard ${max > 0 && tot[i] === max && leaders === 1 ? 'lead' : ''}" style="--c:${col(i)}">
      ${max > 0 && tot[i] === max && leaders === 1 ? `<svg class="crown" aria-hidden="true"><use href="#i-crown"/></svg>` : ''}
      <span class="corner tl"><b>${esc(initial(nameOf(i)))}</b>${icon(suitOf(i))}</span>
      <span class="corner br"><b>${esc(initial(nameOf(i)))}</b>${icon(suitOf(i))}</span>
      <div class="pname">${esc(nameOf(i))}</div>
      <div class="pscore">${tot[i]}</div>
      <div class="pgoal">${L.toGo(S.target - tot[i])}</div>
      <div class="pips" aria-label="${L.scopeLbl}: ${sc}">${pips}</div>
      <div class="pact">
        <button class="addscopa" data-act="scopa" data-i="${i}" ${over ? 'disabled' : ''}><svg aria-hidden="true"><use href="#i-broom"/></svg>${L.addScopa}</button>
        <button class="undo" data-act="unscopa" data-i="${i}" aria-label="${L.undo}" ${sc ? '' : 'disabled'}>−</button>
      </div>
    </div>`;
  }).join('') + '</div>';

  if (!over) html += `<button class="btn primary block" data-act="open-round">${L.endRound}</button>`;

  if (S.rounds.length) {
    html += `<div class="meta"><span class="eyebrow">${L.history}</span></div>`;
    const rows = S.rounds.map((r, ri) => {
      const p = scoreRound(r, n);
      return `<tr data-act="edit-round" data-i="${ri}" tabindex="0"><td>${ri + 1}</td>${p.map(v => `<td class="${v ? '' : 'zero'}">${v ? '+' + v : '0'}</td>`).join('')}<td class="edit">${L.edit}</td></tr>`;
    }).join('');
    html += `<div class="hist"><table>
      <thead><tr><th>#</th>${S.sides.map((s, i) => `<th><span>${sw(col(i))}${esc(nameOf(i))}</span></th>`).join('')}<th></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>${L.total}</td>${tot.map(v => `<td>${v}</td>`).join('')}<td></td></tr></tfoot>
    </table></div>`;
  }
  if (!S.example) html += `<button class="btn ghost" data-act="new-game">${L.newGame}</button>`;
  return html + '</div>';
}

function sheetView() {
  const L = t(), d = ui.draft, n = S.sides.length;
  const roundNo = ui.editIndex != null ? ui.editIndex + 1 : S.rounds.length + 1;
  const pts = scoreRound(d, n);
  const names = { carte: 'Carte', denari: 'Denari', settebello: 'Settebello', primiera: 'Primiera' };
  const open = CATS.filter(k => d[k] == null).map(k => names[k]);
  const cat = (key, sub, extra = '', tie = true, body = '') => `
    <section class="cat">
      <div class="cat-head"><div><h3>${names[key]}</h3><span class="sub">${sub}</span></div>${extra}</div>
      ${chips(key, d[key], tie)}${body}

  return `

        </div>`).join('')}</div>

    <p>Gespielt wird meist bis <b>11</b> (auch 16 oder 21). Erreichen mehrere das Ziel in derselben Runde, gewinnt der höhere Stand. Bei Gleichstand an der Spitze wird eine weitere Runde gespielt.</p>
  </section>
</div>`,
en: () => `
<div class="rules">
  <section>
    <span class="eyebrow">Regole della Scopa</span>
    <h2>How to play Scopa</h2>
    <p class="lede">Capture cards from the table, sweep it clean when you can, and collect points after each round. First to 11 points wins.</p>
  </section>
  <section>
    <h3>The deck</h3>
    <p>An Italian deck of <b>40 cards</b> in four suits. Each suit has ace to 7 plus <b>Fante</b> (jack, 8), <b>Cavallo</b> (knight, 9) and <b>Re</b> (king, 10).</p>
    <div class="suitlist">
      <div style="--c:var(--s1)">${icon('denari')}<p><b>Denari</b><span>Coins</span></p></div>
      <div style="--c:var(--s2)">${icon('coppe')}<p><b>Coppe</b><span>Cups</span></p></div>
      <div style="--c:var(--s3)">${icon('spade')}<p><b>Spade</b><span>Swords</span></p></div>
      <div style="--c:var(--s4)">${icon('bastoni')}<p><b>Bastoni</b><span>Clubs</span></p></div>
    </div>
    <p>With a French deck: remove the 8s, 9s and 10s. Diamonds then count as coins.</p>
  </section>
  <section>
    <h3>Dealing</h3>
    <p>Everyone gets <b>3 cards</b> and <b>4 cards</b> go face up on the table. When all hands are empty, the dealer deals 3 more to each player. No new cards go to the table until the deck runs out.</p>
    <div class="tbl"><table>
      <thead><tr><th>Players</th><th>Format</th><th>Deals per round</th></tr></thead>
      <tbody>
        <tr><td>2</td><td>everyone for themselves</td><td>6 ×</td></tr>
        <tr><td>3</td><td>everyone for themselves</td><td>4 ×</td></tr>
        <tr><td>4</td><td>2 teams of 2, partners opposite</td><td>3 ×</td></tr>
        <tr><td>6</td><td>3 teams of 2 or 2 teams of 3</td><td>2 ×</td></tr>
      </tbody></table></div>
    <p>Partners pool their captured cards. In the tracker, add a team instead of individual players.</p>
  </section>
  <section>
    <h3>A turn</h3>
    <ul>
      <li>Play one card. If a card of the <b>same value</b> is on the table, take it.</li>
      <li>Otherwise you can take several cards that <b>add up</b> to its value: a 7 takes 4 + 3.</li>
      <li>If both are possible, you must take the <b>single card</b>.</li>
      <li>If you can’t capture, your card stays face up on the table.</li>
    </ul>
  </section>
  <section>
    <h3>Scopa</h3>
    <p>Taking <b>every card</b> on the table is a scopa (sweep) and scores 1 point. In the tracker, tap <b>Scopa</b> right when it happens. The very last capture of a round doesn’t count as a scopa. Whoever captured last takes the cards left on the table.</p>
  </section>
  <section>
    <h3>Scoring each round</h3>
    <div class="tbl"><table>
      <thead><tr><th>Point</th><th>Who gets it</th></tr></thead>
      <tbody>
        <tr><td><em>Carte</em></td><td>most cards (more than 20 with two sides)</td></tr>
        <tr><td><em>Denari</em></td><td>most coins</td></tr>
        <tr><td><em>Settebello</em></td><td>whoever has the seven of coins</td></tr>
        <tr><td><em>Primiera</em></td><td>the best set, see below</td></tr>
        <tr><td><em>Scope</em></td><td>1 point per sweep</td></tr>
      </tbody></table></div>
    <p>If Carte, Denari or Primiera is tied, nobody gets that point.</p>
  </section>
  <section>
    <h3>Primiera</h3>
    <p>Each side takes its <b>best card in every suit</b> from its captures and adds up their primiera values. The highest total wins. Here the <b>7 is the strongest</b> card and face cards are the weakest.</p>
    <div class="cards">${PRIM_CARDS.map(([v, l]) => `<div class="mini"><b>${l === 'F' ? 'FCR' : l}</b><span>${v}</span></div>`).join('')}</div>
    <div class="example"><span><b>A:</b> 7 coins, 7 cups, 6 swords, ace of clubs = 21 + 21 + 18 + 16 = <b>76</b></span><span><b>B:</b> 7 coins, king of cups, 5 swords, 7 clubs = 21 + 10 + 15 + 21 = <b>67</b></span><span>A gets the point.</span></div>
    <p>Usually it’s obvious: whoever has more 7s, then more 6s. Only when it’s close does the calculator help. A side missing a suit can’t win the primiera.</p>
  </section>
  <section>
    <h3>Winning</h3>
    <p>Games usually go to <b>11</b> (sometimes 16 or 21). If several sides pass the target in the same round, the higher score wins. If the leaders are tied, play another round.</p>
  </section>
</div>`
};

/* ---------- render ---------- */
function render() {
  const L = t();
  document.documentElement.lang = S.lang;
  document.getElementById('lang-de').classList.toggle('on', S.lang === 'de');
  document.getElementById('lang-en').classList.toggle('on', S.lang === 'en');
  document.getElementById('tab-game').classList.toggle('on', ui.tab === 'game');
  document.getElementById('tab-rules').classList.toggle('on', ui.tab === 'rules');
  document.getElementById('tab-game-l').textContent = L.game;
  document.getElementById('tab-rules-l').textContent = L.rules;
  document.getElementById('view').innerHTML = ui.tab === 'rules' ? RULES[S.lang]() : ui.setup ? setupView() : gameView();
  ui.popIdx = -1;
  renderSheet();
}

function renderSheet() {
  const sheet = document.getElementById('sheet');
  if (!ui.draft) { sheet.hidden = true; sheet.innerHTML = ''; document.body.style.overflow = ''; return; }
  const prev = document.getElementById('sheet-body')?.scrollTop || 0;
  sheet.innerHTML = sheetView();
  sheet.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('sheet-body').scrollTop = prev;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

function openSheet(draft, editIndex) {
  ui.draft = draft; ui.editIndex = editIndex; ui.confirmDel = false; ui.calc = null;
  renderSheet();
  document.getElementById('sheet-body').scrollTop = 0;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, i = +el.dataset.i;
  const d = ui.draft, L = t();
  switch (act) {
    case 'lang': S.lang = v; persist(); render(); return;
    case 'tab': ui.tab = v; render(); window.scrollTo(0, 0); return;
    case 'scopa': S.live[i] = (S.live[i] || 0) + 1; ui.popIdx = i; persist(); render(); return;
    case 'unscopa': S.live[i] = Math.max(0, (S.live[i] || 0) - 1); persist(); render(); return;
    case 'new-game':
      ui.setup = { sides: S.example ? [{ name: '', color: 0 }, { name: '', color: 1 }] : S.sides.map(s => ({ ...s })), target: S.target };
      ui.tab = 'game'; render(); window.scrollTo(0, 0); return;
    case 'rematch': S.rounds = []; S.live = S.sides.map(() => 0); persist(); render(); return;
    case 'setup-add': {
      const used = ui.setup.sides.map(s => s.color);
      let c = 0; while (used.includes(c) && c < COLORS - 1) c++;
      ui.setup.sides.push({ name: '', color: c }); render();
      document.getElementById(`setup-name-${ui.setup.sides.length - 1}`)?.focus();
      return;
    }
    case 'setup-remove': ui.setup.sides.splice(i, 1); render(); return;
    case 'setup-color': ui.setup.sides[i].color = (ui.setup.sides[i].color + 1) % COLORS; render(); return;
    case 'setup-target': ui.setup.target = +v; render(); return;
    case 'setup-cancel': ui.setup = null; render(); return;
    case 'setup-start':
      S = { lang: S.lang, example: false, target: ui.setup.target,
        sides: ui.setup.sides.map((s, k) => ({ name: s.name.trim() || L.namePh(k + 1), color: s.color })), rounds: [], live: ui.setup.sides.map(() => 0) };
      ui.setup = null; persist(); render(); return;
    case 'open-round': openSheet(blankRound(S.sides.length, S.live), null); return;
    case 'edit-round': openSheet(JSON.parse(JSON.stringify(S.rounds[i])), i); return;
    case 'close-sheet': ui.draft = null; renderSheet(); return;
    case 'scope': d.scope[i] = Math.max(0, d.scope[i] + +v); renderSheet(); return;
    case 'pick': { const val = v === 'tie' ? 'tie' : +v; d[el.dataset.cat] = d[el.dataset.cat] === val ? null : val; renderSheet(); return; }
    case 'calc': ui.calc = ui.calc ? null : S.sides.map(() => [0, 0, 0, 0]); renderSheet(); return;
    case 'save-round': {
      const pts = scoreRound(d, S.sides.length);
      const no = ui.editIndex != null ? ui.editIndex + 1 : S.rounds.length + 1;
      if (ui.editIndex != null) S.rounds[ui.editIndex] = d;
      else { S.rounds.push(d); S.live = S.sides.map(() => 0); }
      ui.draft = null; persist(); render();
      toast(L.saved(no, S.sides.map((s, k) => `${nameOf(k)} +${pts[k]}`).join(', ')));
      return;
    }
    case 'del-round': ui.confirmDel = true; renderSheet(); return;
    case 'del-no': ui.confirmDel = false; renderSheet(); return;
    case 'del-yes': S.rounds.splice(ui.editIndex, 1); ui.draft = null; persist(); render(); return;
  }
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && ui.draft) { ui.draft = null; renderSheet(); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'setup-name') ui.setup.sides[+el.dataset.i].name = el.value;
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.in !== 'prim') return;
  ui.calc[+el.dataset.i][+el.dataset.s] = +el.value;
  const { winner } = primiera(ui.calc);
  if (winner != null) ui.draft.primiera = winner;
  renderSheet();
});

render();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
