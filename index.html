<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scopa">
<meta name="theme-color" content="#E7E9E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Scopa Segnapunti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: one phone column. Players are stacked rows (suit tile, name + live scopas, score, scopa button).
   Round scoring slides up as a sheet. Tabs pinned to the bottom. Pixel art for every icon, clean sans for all text. */
:root {
  --bg: #E7E9E4; --card: #FFFFFF; --card-edge: #D5D9D1; --surface-2: #F0F2EE; --line: #D3D7CF;
  --ink: #1A1E1B; --ink-2: #545B56; --ink-3: #868D88;
  --accent: #1E4B39; --accent-ink: #FFFFFF; --accent-deep: #123326; --warn: #9A5B00;
  --s1: #A8781A; --s2: #B0281F; --s3: #2B4F8C; --s4: #2F6E33; --s5: #7A3E78; --s6: #1F7A7A; --s7: #8A5A2B; --s8: #4A4F5A;
  --shadow: 0 3px 0 rgb(30 40 32 / .10);
  --backdrop: rgb(20 26 22 / .38);
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --card: #1C211E; --card-edge: #2B322E; --surface-2: #252B27; --line: #313834;
    --ink: #EEF0EC; --ink-2: #B4BBB6; --ink-3: #7F8782;
    --accent: #6CC197; --accent-ink: #0D1511; --accent-deep: #3F8A66; --warn: #E7A64A;
    --s1: #E2B656; --s2: #EC6F63; --s3: #86A8E6; --s4: #7FC37B; --s5: #D193CE; --s6: #5CC4C4; --s7: #D19A62; --s8: #A3A9B5;
    --shadow: 0 3px 0 rgb(0 0 0 / .4);
    --backdrop: rgb(0 0 0 / .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --card: #1C211E; --card-edge: #2B322E; --surface-2: #252B27; --line: #313834;
  --ink: #EEF0EC; --ink-2: #B4BBB6; --ink-3: #7F8782;
  --accent: #6CC197; --accent-ink: #0D1511; --accent-deep: #3F8A66; --warn: #E7A64A;
  --s1: #E2B656; --s2: #EC6F63; --s3: #86A8E6; --s4: #7FC37B; --s5: #D193CE; --s6: #5CC4C4; --s7: #D19A62; --s8: #A3A9B5;
  --shadow: 0 3px 0 rgb(0 0 0 / .4);
  --backdrop: rgb(0 0 0 / .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* iOS home-screen apps with a translucent status bar size the layout viewport short on pages that
   don't scroll, which lifts the fixed tab bar off the bottom. Making the document at least one
   status bar taller than the screen keeps it pinned. */
html { min-height: calc(100% + env(safe-area-inset-top, 0px)); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spr { display: block; flex: none; image-rendering: pixelated; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)); padding-block: env(safe-area-inset-top, 0px) calc(96px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 12px; }
.logo { display: block; color: var(--ink); }
.lang { display: inline-flex; position: relative; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--card); }
.lang::before { content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: 999px; background: var(--ink); transition: transform .28s var(--spring); }
.lang[data-v="en"]::before { transform: translateX(100%); }
.lang button { position: relative; z-index: 1; border: 0; background: none; width: 40px; padding: 5px 0; border-radius: 999px; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--ink-3); transition: color .2s; }
.lang button.on { color: var(--card); }
.pixrule { height: 4px; margin-bottom: 16px; background: repeating-linear-gradient(90deg, var(--s1) 0 8px, transparent 8px 12px, var(--s2) 12px 20px, transparent 20px 24px, var(--s3) 24px 32px, transparent 32px 36px, var(--s4) 36px 44px, transparent 44px 48px); opacity: .85; }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.roundpill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 10px; }
.roundpill b { color: var(--ink); }
h2 { margin: 0; font: 700 26px/1.15 var(--body); letter-spacing: -.015em; text-wrap: balance; }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 16px; font-weight: 700; font-size: 15px; transition: transform .12s var(--ease), background .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 4px 0 var(--accent-deep); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn.block { width: 100%; padding: 16px; font-size: 17px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.danger { color: var(--s2); }
.swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

.note { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 11px 14px; font-size: 14px; color: var(--ink-2); }
.note p { margin: 0; }

/* View transition */
.enter > * { animation: rise .36s var(--ease) both; }
.enter.from-r > * { animation-name: fromR; } .enter.from-l > * { animation-name: fromL; }
@keyframes fromR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes fromL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
.enter > *:nth-child(2) { animation-delay: .03s; } .enter > *:nth-child(3) { animation-delay: .06s; } .enter > *:nth-child(4) { animation-delay: .09s; } .enter > *:nth-child(n+5) { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Player rows */
.table { display: flex; flex-direction: column; gap: 10px; }
.pcard {
  position: relative; overflow: hidden; background: var(--card); border: 2px solid var(--card-edge); border-radius: 12px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 80px; align-items: center; column-gap: 12px; padding: 10px 10px 14px 12px;
  transition: border-color .3s;
}
.pcard.lead { border-color: var(--c); }
.pcard::after { content: ""; position: absolute; inset: 0; background: var(--c); opacity: 0; pointer-events: none; }
.pcard.flash::after { animation: flash .7s var(--ease); }
.pcard.flash { animation: hit .45s var(--spring); }
@keyframes flash { 0% { opacity: .38; } 100% { opacity: 0; } }
@keyframes hit { 0% { transform: scale(1); } 30% { transform: scale(1.025); } 100% { transform: scale(1); } }
.pcard.gain::after { animation: flash 1.1s var(--ease) .15s both; }
.tile { position: relative; width: 52px; height: 64px; border: 2px solid var(--c); border-radius: 7px; background: var(--card); display: grid; place-items: center; }
.tile::before, .tile::after { content: ""; position: absolute; width: 6px; height: 6px; background: var(--c); }
.tile::before { top: 4px; left: 4px; } .tile::after { bottom: 4px; right: 4px; }
.pinfo { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.pname { font-weight: 700; font-size: 17px; line-height: 1.2; display: flex; align-items: center; gap: 7px; min-width: 0; }
.pname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .spr { animation: crownIn .5s var(--spring) both, bob 2.4s ease-in-out .6s infinite; }
@keyframes bob { 0%, 100% { transform: none; } 50% { transform: translateY(-2px) rotate(-6deg); } }
@keyframes crownIn { from { transform: translateY(-6px) scale(.4); opacity: 0; } }
.psub { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 14px; color: var(--ink-3); white-space: nowrap; }
.pips { display: flex; align-items: center; gap: 2px; color: var(--c); }
.pips .spr.new { animation: pop .55s var(--spring); }
@keyframes pop { 0% { transform: scale(0) rotate(-60deg); } 55% { transform: scale(1.7) rotate(10deg); } 100% { transform: none; } }
.pips .num { font-weight: 700; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 4px; }
.undo { width: 28px; height: 28px; flex: none; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink-2); font-size: 17px; line-height: 1; padding: 0; display: grid; place-items: center; transition: transform .12s; }
.undo:active { transform: scale(.9); }
.pscore { font: 700 42px/1 var(--body); font-variant-numeric: tabular-nums; letter-spacing: -.03em; text-align: right; min-width: 1.2em; }
.pscore.bump { animation: bump .6s var(--spring); }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.45); color: var(--c); } 100% { transform: scale(1); } }
.addscopa { position: relative; width: 80px; height: 68px; border: 0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 13px; background: color-mix(in srgb, var(--c) 15%, var(--card)); color: var(--ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, var(--card)); transition: transform .1s, box-shadow .1s; color: var(--ink); }
.addscopa .spr { color: var(--c); transform-origin: 80% 20%; }
.addscopa.sweep .spr { animation: sweep .5s var(--ease); }
@keyframes sweep { 0% { transform: rotate(0); } 30% { transform: rotate(-28deg) translateX(-3px); } 65% { transform: rotate(14deg) translateX(3px); } 100% { transform: rotate(0); } }
.addscopa:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 55%, var(--card)); }
.addscopa:disabled { opacity: .4; }
.floater { position: absolute; right: 22px; top: 6px; font-weight: 800; font-size: 26px; text-shadow: 0 2px 0 var(--card); color: var(--c); pointer-events: none; animation: floatUp .8s var(--ease) forwards; z-index: 2; }
@keyframes floatUp { from { opacity: 0; transform: translateY(18px) scale(.5); } 25% { opacity: 1; transform: translateY(0) scale(1.25); } 60% { opacity: 1; } to { opacity: 0; transform: translateY(-34px) scale(1); } }
.pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--surface-2); }
.pbar i { display: block; height: 100%; background: var(--c); transition: width .7s var(--ease); background-image: repeating-linear-gradient(90deg, transparent 0 6px, rgb(255 255 255 / .22) 6px 8px); }

/* Winner */
.winbox { position: relative; overflow: hidden; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); border: 2px solid var(--c); padding: 22px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.winbox .spr { animation: crownDrop .8s var(--spring) both; }
@keyframes crownDrop { 0% { transform: translateY(-40px) rotate(-12deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.winbox strong { font: 800 28px/1.1 var(--body); letter-spacing: -.02em; }
.winbox > span { color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 600; }
.winbox .row-btns { display: flex; gap: 8px; margin-top: 6px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 8px; background: var(--c); animation: fall var(--d) steps(24) forwards; animation-delay: var(--delay); }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--r)); } }

/* History */
.hist { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.hist table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
.hist th, .hist td { padding: 11px 12px; text-align: center; white-space: nowrap; }
.hist th:first-child, .hist td:first-child { text-align: left; color: var(--ink-3); width: 1%; }
.hist thead th { font-size: 12px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.hist thead th > span { display: inline-flex; align-items: center; gap: 5px; max-width: 7em; overflow: hidden; text-overflow: ellipsis; }
.hist tbody tr { cursor: pointer; transition: background .15s; }
.hist tbody tr + tr td { border-top: 1px solid var(--surface-2); }
.hist tbody tr:active td { background: var(--surface-2); }
.hist td.zero { color: var(--ink-3); }
.hist td.edit { color: var(--ink-3); text-align: right; }
.hist td.edit svg { display: inline-block; vertical-align: middle; }
.hist tfoot td { border-top: 1px solid var(--line); font-weight: 800; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs div { position: relative; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
.tabs div::before { content: ""; position: absolute; top: -1px; left: 0; width: 50%; height: 3px; background: var(--ink); transition: transform .3s var(--spring); transform: scaleX(.3); }
.tabs div[data-v="rules"]::before { transform: translateX(100%) scaleX(.3); }
.tabs button { border: 0; background: none; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ink-3); transition: color .2s; }
.tabs button.on { color: var(--ink); }
.tabs button:active .spr { transform: scale(.88); }
.tabs .spr { transition: transform .15s; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--card); padding: 8px 8px 8px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; width: max-content; max-width: calc(100% - 32px); transform: translate(-50%, 20px); opacity: 0; transition: transform .35s var(--spring), opacity .2s; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { border: 0; background: color-mix(in srgb, var(--card) 18%, transparent); color: var(--card); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; flex: none; }
.toast span { min-width: 0; }

/* Setup */
.field { display: flex; flex-direction: column; gap: 9px; }
.hint { font-size: 13px; color: var(--ink-3); margin: 0; }
.setup-row { display: grid; grid-template-columns: 48px 1fr 40px; gap: 10px; align-items: center; animation: rise .3s var(--ease) both; }
.colorbtn { position: relative; width: 48px; height: 48px; border-radius: 10px; border: 2px solid var(--c); background: var(--card); display: grid; place-items: center; transition: transform .15s var(--spring); }
.colorbtn:active { transform: scale(.9) rotate(-6deg); }
.text { width: 100%; min-width: 0; height: 48px; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 0 14px; font-size: 17px; font-weight: 600; transition: border-color .2s; }
.text:focus { outline: none; border-color: var(--accent); }
.text::placeholder { color: var(--ink-3); font-weight: 500; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; color: var(--ink-3); font-size: 22px; line-height: 1; }
.iconbtn:disabled { opacity: .25; }
.addrow { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1.5px dashed var(--line); border-radius: 12px; background: none; color: var(--ink-2); font-weight: 700; font-size: 15px; }
.addrow:active { background: var(--surface-2); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; min-height: 44px; padding: 8px 14px 8px 11px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; transition: background .18s, border-color .18s, color .18s, transform .12s; }
.chip:active { transform: scale(.95); }
.chip.on { background: color-mix(in srgb, var(--c, var(--ink)) 16%, var(--card)); border-color: var(--c, var(--ink)); }
.chip.pop { animation: chipPop .45s var(--spring); }
.chip.pop.on .check { animation: checkPop .45s var(--spring); }
@keyframes chipPop { 0% { transform: scale(.82); } 50% { transform: scale(1.07); } 100% { transform: none; } }
@keyframes checkPop { 0% { transform: scale(0) rotate(-45deg); } 100% { transform: none; } }
.chip .check { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; transition: background .18s, border-color .18s; }
.chip.on .check { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); }
.chip.on .check::after { content: ""; width: 7px; height: 4px; border-left: 2px solid var(--card); border-bottom: 2px solid var(--card); transform: translateY(-1px) rotate(-45deg); }
.chip.muted { color: var(--ink-2); }
.target-chip { min-width: 64px; justify-content: center; font-size: 17px; padding-inline: 16px; }

/* Round sheet */
.sheet { position: fixed; inset: 0; z-index: 10; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .3s; }
.sheet-body.enter > * { animation: rise .4s var(--ease) both; }
.sheet-body.enter > *:nth-child(2) { animation-delay: .05s; } .sheet-body.enter > *:nth-child(3) { animation-delay: .1s; } .sheet-body.enter > *:nth-child(4) { animation-delay: .15s; } .sheet-body.enter > *:nth-child(n+5) { animation-delay: .2s; }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 600px; margin: 0 auto; max-height: calc(100% - env(safe-area-inset-top, 0px) - 16px); background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .38s var(--ease); box-shadow: 0 -8px 30px rgb(0 0 0 / .18); }
.sheet.open .sheet-backdrop { opacity: 1; }
.sheet.open .sheet-panel { transform: none; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.sheet-head { padding: 6px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 22px; }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.sheet-foot { border-top: 1px solid var(--line); background: var(--card); padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.preview { display: flex; gap: 6px; flex-wrap: wrap; }
.preview > span { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 6px 10px 6px 9px; border-radius: 10px; background: var(--surface-2); font-variant-numeric: tabular-nums; max-width: 100%; }
.preview em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 9em; }
.preview .tot { color: var(--ink-3); font-weight: 600; }
.preview .arrow { color: var(--ink-3); font-weight: 500; }
.preview b { font-size: 16px; color: var(--ink); display: inline-block; }
.preview b.bump { animation: bump .5s var(--spring); }
.preview small { font-size: 12px; font-weight: 800; color: var(--c); }
.progress-row { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; }
.progress-row .open { color: var(--warn); white-space: nowrap; }
.progress-row .ok { color: var(--accent); white-space: nowrap; }
.progress { flex: 1; display: flex; gap: 4px; }
.progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background .25s; }
.progress i.done { background: var(--accent); }
.progress i.new { animation: segFill .45s var(--ease); transform-origin: left; }
@keyframes segFill { from { transform: scaleX(0); } }
.warns { display: flex; flex-direction: column; gap: 6px; }
.warn { display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 7px 6px 7px 10px; border-radius: 10px; font-size: 13px; line-height: 1.35; font-weight: 600; color: var(--ink-2); background: color-mix(in srgb, var(--warn) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.warn.in { animation: warnIn .4s var(--spring); }
@keyframes warnIn { from { opacity: 0; transform: translateY(6px) scale(.97); } }
.warn i { flex: none; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; background: var(--warn); color: var(--card); font-size: 11px; font-weight: 800; line-height: 16px; font-style: normal; text-align: center; }
.warn span { flex: 1; min-width: 0; }
.warn button { flex: none; border: 0; background: none; color: var(--ink-3); font-size: 16px; line-height: 1; padding: 1px 6px; margin: -1px 0; border-radius: 6px; }

.cat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; transition: border-color .25s; }
.cat.done { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.cat-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cat-head > div { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cat h3 { margin: 0; font: 700 17px/1.15 var(--body); }
.cat .sub { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.link { border: 0; background: none; padding: 6px 0; font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.row + .row { border-top: 1px solid var(--surface-2); }
.rname { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.stepper button { width: 44px; height: 40px; border: 0; background: var(--surface-2); font-size: 20px; line-height: 1; }
.stepper button:active { background: var(--line); }
.stepper output.bump { animation: bump .45s var(--spring); }
.stepper output { display: inline-block; min-width: 40px; text-align: center; font: 800 18px/1 var(--body); font-variant-numeric: tabular-nums; }

/* Primiera calculator */
.prim { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--surface-2); padding-top: 12px; animation: rise .3s var(--ease) both; }
.prim-side { display: flex; flex-direction: column; gap: 6px; }
.prim-top { display: flex; align-items: center; gap: 8px; }
.prim-total { font: 800 20px/1 var(--body); font-variant-numeric: tabular-nums; }
.prim-flag { font-size: 12px; color: var(--warn); font-weight: 700; }
.prim-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.prim-side.best .prim-total { color: var(--c); }
.pcell { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 6px 0 7px; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; min-width: 0; text-align: left; transition: border-color .15s, transform .12s; }
.pcell:active { transform: scale(.95); }
.pcell.on { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.pcell span { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.pcell b { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcell small { font-size: 11px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pcell.empty b { color: var(--ink-3); font-weight: 500; }
.picker { border: 1.5px solid var(--c); border-radius: 12px; padding: 10px; background: color-mix(in srgb, var(--c) 6%, var(--card)); display: flex; flex-direction: column; gap: 8px; animation: rise .25s var(--ease) both; }
.picker-title { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.picker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pcard-opt { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 64px; padding: 6px 2px; border: 1.5px solid var(--card-edge); border-radius: 8px; background: var(--card); box-shadow: 0 2px 0 var(--card-edge); transition: transform .12s, border-color .15s; }
.pcard-opt:active { transform: translateY(2px); box-shadow: none; }
.pcard-opt b { font-size: 15px; font-weight: 800; line-height: 1.1; }
.pcard-opt small { font-size: 10px; color: var(--ink-3); font-weight: 600; min-height: 11px; }
.pcard-opt em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.pcard-opt.on { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); background: color-mix(in srgb, var(--c) 14%, var(--card)); }
.pcard-opt:disabled { opacity: .35; box-shadow: none; }
.pcard-opt i { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.pcard-opt.none { grid-column: 1 / -1; min-height: 38px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.prim-key { font-size: 12px; color: var(--ink-3); margin: 0; }
.confirm { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }

/* Rules */
.rules { display: flex; flex-direction: column; gap: 24px; }
.rules section { display: flex; flex-direction: column; gap: 9px; }
.rules h3 { margin: 0; font: 700 20px/1.2 var(--body); letter-spacing: -.01em; }
.rules p { margin: 0; max-width: 65ch; color: var(--ink-2); }
.rules p b, .rules li b { color: var(--ink); }
.rules ul { margin: 0; padding-left: 20px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.lede { font: 500 18px/1.45 var(--body); color: var(--ink) !important; }
.suitlist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.suitlist div { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.suitlist p { margin: 0; }
.suitlist b { display: block; font: 700 16px/1.1 var(--body); color: var(--ink); }
.suitlist span { font-size: 13px; color: var(--ink-3); }
.tbl { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; vertical-align: top; }
.tbl thead th { font-size: 12px; color: var(--ink-3); font-weight: 700; border-bottom: 1px solid var(--line); }
.tbl tbody tr + tr td { border-top: 1px solid var(--surface-2); }
.tbl td:first-child { font-weight: 700; white-space: nowrap; }
.tbl em { font-style: normal; font-weight: 700; }
.cards { display: flex; gap: 6px; flex-wrap: wrap; }
.mini { width: 44px; border: 1.5px solid var(--card-edge); background: var(--card); border-radius: 7px; padding: 6px 0 5px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: var(--shadow); }
.mini b { font: 800 15px/1 var(--body); }
.mini.wide { width: auto; padding-inline: 10px; }
.mini span { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.example { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.example b { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .confetti { display: none; }
}
</style>
</head>
<body>
<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div class="wrap">
  <header class="top">
    <span id="logo" role="img" aria-label="Scopa"></span>
    <div class="lang" id="lang" role="group" aria-label="Sprache / Language">
      <button id="lang-de" data-act="lang" data-v="de">DE</button>
      <button id="lang-en" data-act="lang" data-v="en">EN</button>
    </div>
  </header>
  <div class="pixrule" aria-hidden="true"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Main">

    <button id="tab-game" data-act="tab" data-v="game"><span id="tab-game-i"></span><span id="tab-game-l"></span></button>
    <button id="tab-rules" data-act="tab" data-v="rules"><span id="tab-rules-i"></span><span id="tab-rules-l"></span></button>
  </div>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-act="close-sheet"></div>
  <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status"><span id="toast-msg"></span><button id="toast-btn" data-act="toast-undo" hidden></button></div>

<script>
(() => {
/* ---------- pixel sprites (16px grid, drawn in code, rendered as crisp SVG) ---------- */
const SPRITES = (() => {
  const make = (w, h, fn) => Array.from({ length: h }, (_, y) => Array.from({ length: w }, (_, x) => fn(x + .5, y + .5) || '.'));
  const outline = (g, ch = 'o') => g.map((row, y) => row.map((c, x) => {
    if (c !== '.') return c;
    const n = [[0, -1], [0, 1], [-1, 0], [1, 0]].some(([dx, dy]) => { const v = g[y + dy]?.[x + dx]; return v && v !== '.' && v !== ch; });
    return n ? ch : '.';
  }));
  const halves = (rows, swap = {}) => rows.map(l => [...l, ...[...l].reverse().map(c => swap[c] || c)]);
  const rows = r => r.map(l => [...l]);

  const coin = outline(make(16, 16, (x, y) => {
    const dx = x - 8, dy = y - 8, d = Math.hypot(dx, dy), lit = (-dx - dy) / (d || 1);
    if (d > 7) return;
    if (d > 5.5) return lit > .45 ? 'h' : lit < -.45 ? 'd' : 'b';
    if (d > 4.5) return 'd';
    if (d < 1.5) return 'w';
    if (d < 2.5) return 'h';
    if (d > 3.5 && lit > .55) return 'h';
    return 'b';
  }));

  const cup = halves([
    '........',
    '..oooooo',
    '.oghgggg',
    '.ohwbbbb',
    '.ohwbbbb',
    '.ohbbbbb',
    '..ohbbbb',
    '..ohbbbb',
    '...oohbb',
    '.....ooh',
    '......oh',
    '......oh',
    '.....ogh',
    '....oggg',
    '...ogggg',
    '...ooooo',
  ], { h: 'd', w: 'b', g: 'G' });

  const sword = halves([
    '.......o',
    '......ow',
    '.....owb',
    '.....owb',
    '.....owb',
    '.....owb',
    '.....owb',
    '.....owb',
    '.....owb',
    '.....owb',
    '.....owb',
    '.ooooooo',
    'oggggggg',
    '.ooooooo',
    '......op',
    '.....ogg',
  ], { w: 'd', b: 'b', g: 'G' });

  const club = (() => {
    const A = [4.4, 12.6], B = [11.2, 4.8];
    const vx = B[0] - A[0], vy = B[1] - A[1], L = Math.hypot(vx, vy), nx = -vy / L, ny = vx / L;
    const rad = t => 1.25 + 1.45 * t;
    const knots = [[.3, 1], [.55, -1], [.8, 1]].map(([t, side]) => [A[0] + vx * t + nx * side * (rad(t) + .7), A[1] + vy * t + ny * side * (rad(t) + .7), side]);
    return outline(make(16, 16, (x, y) => {
      let t = ((x - A[0]) * vx + (y - A[1]) * vy) / (L * L); t = Math.max(0, Math.min(1, t));
      const dx = x - (A[0] + vx * t), dy = y - (A[1] + vy * t), r = rad(t);
      const s = dx * nx + dy * ny;
      if (Math.hypot(dx, dy) <= r) { const ring = Math.round(t * 9) % 3 === 0 && Math.abs(s) < r * .5; return ring ? 'g' : s < -r * .25 ? 'h' : s > r * .4 ? 'd' : 'b'; }
      const k = knots.find(([kx, ky]) => Math.hypot(x - kx, y - ky) <= 1.05);
      if (k) return k[2] < 0 ? 'h' : 'd';
    }));
  })();

  const broom = outline(make(16, 16, (x, y) => {
    const Bx = 6.9, By = 9.1, rx = x - Bx, ry = y - By;
    const a = (rx - ry) * Math.SQRT1_2, s = (rx + ry) * Math.SQRT1_2;
    if (a > 0 && a < 8.8 && Math.abs(s) <= .8) return s < 0 ? 'P' : 'p';
    if (a <= 0 && a > -1.5 && Math.abs(s) <= 1.9) return 'c';
    const b = -a - 1.5;
    if (b >= 0 && b < 3.7 && Math.abs(s) <= 1.6 + b * .45) return Math.abs(Math.round(s * 1.2)) % 2 ? 'S' : 's';
  }));

  const crown = halves([
    '.o.....o',
    'oho...oh',
    'ohho.ohh',
    'ohhhohhh',
    'oggggggg',
    'ogrgggbg',
    'oggggggg',
    'oddddddd',
    '.ooooooo',
  ], { h: 'g', r: 'b', b: 'r' });

  const seven = rows([
    '.oooooooooo.',
    'owwwwwwwwwwo',
    'owwrrrrrrwwo',
    'owwrrrrrrwwo',
    'owwwwwwrrwwo',
    'owwwwwrrwwwo',
    'owwwwwrrwwwo',
    'owwwwrrwwwwo',
    'owwwwrrwwwwo',
    'owwwrrwwwwwo',
    'owwwrrwwwwwo',
    'owwwwwwwwwwo',
    'owwwwwwwggwo',
    'owwwwwwwggwo',
    '.oooooooooo.',
  ]);

  const cards = (() => {
    const inR = (x, y, x0, y0, x1, y1) => x >= x0 && x <= x1 && y >= y0 && y <= y1;
    const edge = (x, y, x0, y0, x1, y1) => x === x0 || x === x1 || y === y0 || y === y1;
    const corner = (x, y, x0, y0, x1, y1) => (x === x0 || x === x1) && (y === y0 || y === y1);
    return Array.from({ length: 16 }, (_, y) => Array.from({ length: 16 }, (_, x) => {
      const F = [1, 3, 10, 15], K = [5, 0, 14, 12];
      if (inR(x, y, ...F)) return corner(x, y, ...F) ? '.' : edge(x, y, ...F) ? 'o' : (x >= 4 && x <= 7 && y >= 7 && y <= 10) ? ((x + y) % 2 ? 'r' : 'R') : 'w';
      if (inR(x, y, ...K)) return corner(x, y, ...K) ? '.' : edge(x, y, ...K) ? 'o' : (x + y) % 2 ? 'k' : 'K';
      return '.';
    }));
  })();

  const mask = r => r.map(l => [...l].map(c => c === '.' ? '.' : 'c'));
  const tabGame = (() => {
    const g = Array.from({ length: 16 }, (_, y) => Array.from({ length: 16 }, (_, x) => {
      const inF = x >= 1 && x <= 9 && y >= 4 && y <= 15, inK = x >= 6 && x <= 14 && y >= 0 && y <= 11;
      const eF = inF && (x === 1 || x === 9 || y === 4 || y === 15), eK = inK && (x === 6 || x === 14 || y === 0 || y === 11);
      if (inF) return eF || (Math.abs(x - 5) + Math.abs(y - 9.5) <= 2) ? 'c' : '.';
      return eK ? 'c' : '.';
    }));
    return g;
  })();
  const tabRules = mask([
    '................',
    '................',
    '.ooooo....ooooo.',
    'o.....o..o.....o',
    'o.ooo..oo..ooo.o',
    'o......oo......o',
    'o.ooo..oo..ooo.o',
    'o......oo......o',
    'o.ooo..oo..ooo.o',
    'o......oo......o',
    'o......oo......o',
    'oooooo.oo.oooooo',
    '......oooo......',
    '................',
  ]);

  const P = {
    coin: { o: '#7A4D0C', d: '#BB8118', b: '#E2AA30', h: '#F8D877', w: '#FFF7D6' },
    cup: { o: '#5E120E', d: '#8F1E17', b: '#C9372B', h: '#EE6F58', w: '#FFD9CC', g: '#E8B44A', G: '#A87414' },
    sword: { o: '#1F3561', d: '#8299C9', b: '#BFD0EE', w: '#F4F8FF', g: '#E2AA30', G: '#A87414', p: '#6B4423' },
    club: { o: '#1D3F17', d: '#2E6A27', b: '#4C963C', h: '#86C964', g: '#2E6A27' },
    broom: { o: '#4A2E12', p: '#93602F', P: '#C8904F', s: '#EBC060', S: '#B98A2C', c: 'currentColor' },
    crown: { o: '#6B4A0A', d: '#B07A14', g: '#E5AD2C', h: '#FFE38C', r: '#E5484D', b: '#4D8FE5' },
    seven: { o: '#3A3B36', w: '#FBFBF6', r: '#C8322A', g: '#E2AA30' },
    cards: { o: '#3A3B36', w: '#FBFBF6', r: '#C8322A', R: '#E8604F', k: '#3D63A8', K: '#5B82C6' },
    tab: { c: 'currentColor' },
  };
  return {
    denari: [coin, P.coin], coppe: [cup, P.cup], spade: [sword, P.sword], bastoni: [club, P.club],
    broom: [broom, P.broom], crown: [crown, P.crown], seven: [seven, P.seven], cards: [cards, P.cards],
    tabGame: [tabGame, P.tab], tabRules: [tabRules, P.tab],
  };
})();
const SPR_SIZE = {};
document.getElementById('sprite').innerHTML = Object.entries(SPRITES).map(([id, [g, pal]]) => {
  const h = g.length, w = g[0].length;
  SPR_SIZE[id] = [w, h];
  const byColor = {};
  g.forEach((row, y) => {
    for (let x = 0; x < w;) {
      const c = row[x];
      if (c === '.' || !pal[c]) { x++; continue; }
      const s = x; while (row[x] === c) x++;
      (byColor[pal[c]] ||= []).push(`M${s} ${y}h${x - s}v1h-${x - s}z`);
    }
  });
  return `<symbol id="s-${id}" viewBox="0 0 ${w} ${h}">${Object.entries(byColor).map(([fill, d]) => `<path fill="${fill}" d="${d.join('')}"/>`).join('')}</symbol>`;
}).join('');
const spr = (id, scale = 1, cls = '') => { const [w, h] = SPR_SIZE[id]; return `<svg class="spr ${cls}" width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true"><use href="#s-${id}"/></svg>`; };


const KEY = 'scopa-tracker-v3';
const SUITS = ['denari', 'coppe', 'spade', 'bastoni'];
const COLORS = 8;
// Primiera values per card, strongest first. Re, Cavallo and Fante are the three face cards (no queen in an Italian deck).
const PRIM = [ ['7', 21], ['6', 18], ['A', 16], ['5', 15], ['4', 14], ['3', 13], ['2', 12], ['R', 10], ['C', 10], ['F', 10] ];
const PRIM_PTS = Object.fromEntries(PRIM);
const CATS = ['carte', 'denari', 'settebello', 'primiera'];
const CAT_ICON = { carte: 'cards', denari: 'denari', settebello: 'seven', primiera: 'crown' };

/* pixel wordmark */
(() => {
  const F = { S: ['.XXX.', 'X...X', 'X....', '.XXX.', '....X', 'X...X', '.XXX.'], C: ['.XXX.', 'X...X', 'X....', 'X....', 'X....', 'X...X', '.XXX.'], O: ['.XXX.', 'X...X', 'X...X', 'X...X', 'X...X', 'X...X', '.XXX.'], P: ['XXXX.', 'X...X', 'X...X', 'XXXX.', 'X....', 'X....', 'X....'], A: ['.XXX.', 'X...X', 'X...X', 'XXXXX', 'X...X', 'X...X', 'X...X'] };
  const shadow = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s1)'];
  let d = '', sh = '';
  [...'SCOPA'].forEach((ch, i) => {
    const ox = i * 7;
    let part = '';
    F[ch].forEach((row, y) => { for (let x = 0; x < 5;) { if (row[x] !== 'X') { x++; continue; } const s = x; while (row[x] === 'X') x++; part += `M${ox + s} ${y}h${x - s}v1h-${x - s}z`; } });
    d += part; sh += `<path fill="${shadow[i]}" transform="translate(1 1)" d="${part}"/>`;
  });
  document.getElementById('logo').innerHTML = `<svg class="logo" width="${35 * 4}" height="${8 * 4}" viewBox="0 0 35 8" shape-rendering="crispEdges" aria-hidden="true">${sh}<path fill="currentColor" d="${d}"/></svg>`;
})();

const T = {
  de: {
    game: 'Spiel', rules: 'Regeln',
    newGame: 'Neue Partie', rematch: 'Revanche',
    endRound: 'Runde werten', playTo: n => `Ziel ${n}`, roundN: n => `Runde ${n}`,
    toGo: n => n > 0 ? `noch ${n}` : 'Ziel erreicht',
    addScopa: 'Scopa', undo: 'Letzte Scopa zurücknehmen', scopeLbl: 'Scope',
    history: 'Bisherige Runden', total: 'Gesamt', edit: 'ändern',
    wins: n => `${n} gewinnt!`, finalScore: 'Endstand',
    tieTop: names => `Gleichstand an der Spitze (${names}). Spielt noch eine Runde.`,
    setupTitle: 'Neue Partie', sides: 'Wer spielt?',
    sidesHint: 'Ein Eintrag pro Spieler oder pro Team. Tippe auf das Symbol, um die Farbe zu wechseln.',
    replaceWarn: 'Die laufende Partie wird dabei beendet.',
    addSide: 'Spieler oder Team hinzufügen', namePh: n => `Spieler ${n}`, remove: 'Entfernen', color: 'Farbe wechseln',
    target: 'Gespielt wird bis', start: 'Los geht’s', cancel: 'Abbrechen',
    close: 'Schließen', sheetTitle: n => `Runde ${n} werten`, editRound: n => `Runde ${n} ändern`,
    scopeSub: 'in dieser Runde, live mitgezählt',

/* ---------- state ---------- */
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && Array.isArray(s.sides) ? s : null; } catch { return null; } }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const freshState = () => ({ lang: 'de', target: 11, sides: [], rounds: [], live: [] });
const blankRound = (n, scope) => ({ scope: scope ? scope.slice() : Array(n).fill(0), carte: null, denari: null, settebello: null, primiera: null });
const blankSetup = () => ({ sides: [{ name: '', color: 0 }, { name: '', color: 1 }], target: 11 });

let S = load() || freshState();
const ui = { tab: 'game', setup: S.sides.length ? null : blankSetup(), draft: null, editIndex: null, confirmDel: false, calc: null,
  popIdx: -1, picked: null, viewKey: '', shownTot: null, undo: null };
const t = () => T[S.lang] || T.de;

/* ---------- scoring (pure) ---------- */
function scoreRound(r, n) {
  const pts = Array.from({ length: n }, (_, i) => r.scope[i] || 0);
  for (const k of CATS) if (typeof r[k] === 'number' && r[k] < n) pts[r[k]] += 1;
  return pts;
}
function primiera(cards) {
  const prim = cards.map(row => ({ sum: row.reduce((a, c) => a + (PRIM_PTS[c] || 0), 0), complete: row.every(Boolean), touched: row.some(Boolean) }));
  const elig = prim.map((p, i) => p.complete ? i : -1).filter(i => i >= 0);
  let winner = null;
  if (elig.length) {
    const max = Math.max(...elig.map(i => prim[i].sum));
    const top = elig.filter(i => prim[i].sum === max);
    winner = top.length === 1 ? top[0] : 'tie';
  }
  return { prim, winner };
}
// plausibility hints: never block, just flag what rarely or never happens in a real round
function sanity(r, calc, n) {
  const out = [], sc = r.scope.slice(0, n), sum = sc.reduce((a, b) => a + b, 0);
  const many = sc.map((v, i) => v >= 5 ? i : -1).filter(i => i >= 0);
  many.forEach(i => out.push(['scope' + i, 'scopeSide', i, sc[i]]));
  if (!many.length && sum >= 7) out.push(['scope', 'scopeAll', sum]);
  if (calc) {
    const has7 = calc.findIndex(row => row[0] === '7'), sb = r.settebello;
    if (typeof sb === 'number') {
      if (has7 >= 0 && has7 !== sb) out.push(['sette', 'sette', has7, sb]);
      else if (has7 < 0 && calc[sb]?.[0]) out.push(['sette', 'setteNo7', sb]);
    }
    const { winner } = primiera(calc);
    if (winner != null && r.primiera != null && r.primiera !== winner) out.push(['prim', 'prim', winner]);
  }
  return out;
}
function totals() {
  const n = S.sides.length;
  return S.rounds.reduce((acc, r) => { scoreRound(r, n).forEach((p, i) => acc[i] += p); return acc; }, Array(n).fill(0));
}
function gameResult(tot) {
  if (!tot.length) return null;
  const max = Math.max(...tot);
  if (max < S.target) return null;
  const top = tot.map((v, i) => v === max ? i : -1).filter(i => i >= 0);
  return top.length === 1 ? { winner: top[0] } : { tie: top };
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const colIdx = i => (S.sides[i]?.color ?? i) % COLORS;
const col = i => `var(--s${colIdx(i) + 1})`;
const suitOf = i => SUITS[colIdx(i) % 4];
const nameOf = i => S.sides[i].name || t().namePh(i + 1);
const sw = c => `<span class="swatch" style="--c:${c}"></span>`;

/* ---------- views ---------- */
function gameView() {
  const L = t();
  const tot = totals();
  const res = gameResult(tot);
  const n = S.sides.length;
  const max = Math.max(...tot);
  const leaders = tot.filter(v => v === max).length;
  const over = res?.winner != null;
  const prev = ui.shownTot && ui.shownTot.length === n ? ui.shownTot : tot;
  let html = '';

  if (over) {
    html += `<div class="winbox" style="--c:${col(res.winner)}">${spr('crown', 4)}<strong>${esc(L.wins(nameOf(res.winner)))}</strong>
      <span>${L.finalScore} ${tot.join(' : ')}</span>
      <div class="row-btns"><button class="btn primary" data-act="rematch">${L.rematch}</button><button class="btn" data-act="new-game">${L.newGame}</button></div></div>`;
  } else if (res?.tie) {
    html += `<div class="note">${spr('crown', 1)}<p>${esc(L.tieTop(res.tie.map(nameOf).join(', ')))}</p></div>`;
  }

  html += `<div class="meta"><span class="roundpill">${spr('cards', 1)}<b>${L.roundN(S.rounds.length + (over ? 0 : 1))}</b></span><span class="eyebrow">${L.playTo(S.target)}</span></div>`;

  html += `<div class="table">` + S.sides.map((s, i) => {
    const sc = S.live[i] || 0;
    const lead = max > 0 && tot[i] === max && leaders === 1;
    const pips = sc === 0 ? '' : sc <= 5
      ? Array.from({ length: sc }, (_, k) => spr('broom', 1, k === sc - 1 && ui.popIdx === i ? 'new' : '')).join('')
      : spr('broom', 1, ui.popIdx === i ? 'new' : '') + `<span class="num">× ${sc}</span>`;
    return `
    <div class="pcard ${lead ? 'lead' : ''}" id="pcard-${i}" style="--c:${col(i)}">
      <div class="tile">${spr(suitOf(i), 2)}</div>
      <div class="pinfo">
        <div class="pname"><span>${esc(nameOf(i))}</span>${lead ? spr('crown', 1) : ''}</div>
        <div class="psub">${sc
          ? `<span class="pips" aria-label="${L.scopeLbl}: ${sc}">${pips}</span><button class="undo" data-act="unscopa" data-i="${i}" aria-label="${L.undo}">−</button>`
          : `<span>${L.toGo(S.target - tot[i])}</span>`}</div>
      </div>
      <div class="pscore" id="score-${i}" data-from="${prev[i]}" data-to="${tot[i]}">${prev[i]}</div>
      <button class="addscopa" data-act="scopa" data-i="${i}" ${over ? 'disabled' : ''}>${spr('broom', 2)}${L.addScopa}</button>
      <div class="pbar"><i id="bar-${i}" style="width:${Math.min(100, prev[i] / S.target * 100)}%" data-to="${Math.min(100, tot[i] / S.target * 100)}"></i></div>
    </div>`;
  }).join('') + '</div>';

  if (!over) html += `<button class="btn primary block" data-act="open-round">${spr('seven', 1)}${L.endRound}</button>`;

  if (S.rounds.length) {
    html += `<div class="meta" style="margin-top:8px"><span class="eyebrow">${L.history}</span></div>`;
    const rows = S.rounds.map((r, ri) => {
      const p = scoreRound(r, n);
      return `<tr data-act="edit-round" data-i="${ri}" tabindex="0"><td>${ri + 1}</td>${p.map(v => `<td class="${v ? '' : 'zero'}">${v ? '+' + v : '0'}</td>`).join('')}<td class="edit">›</td></tr>`;
    }).join('');
    html += `<div class="hist"><table>
      <thead><tr><th>#</th>${S.sides.map((s, i) => `<th><span>${sw(col(i))}${esc(nameOf(i))}</span></th>`).join('')}<th></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>${L.total}</td>${tot.map(v => `<td>${v}</td>`).join('')}<td></td></tr></tfoot>
    </table></div>`;
  }
  if (!over) html += `<button class="btn ghost" data-act="new-game">${L.newGame}</button>`;
  return html;
}

function setupView() {
  const L = t(), d = ui.setup;
  const running = S.sides.length && (S.rounds.length || S.live.some(Boolean));
  return `
    <h2>${L.setupTitle}</h2>
    <div class="field">
      <span class="eyebrow">${L.sides}</span>
      ${d.sides.map((s, i) => `
        <div class="setup-row" style="animation-delay:${i * .04}s">
          <button class="colorbtn" style="--c:var(--s${s.color % COLORS + 1})" data-act="setup-color" data-i="${i}" aria-label="${L.color}">${spr(SUITS[s.color % 4], 2)}</button>
          <input class="text" id="setup-name-${i}" data-in="setup-name" data-i="${i}" value="${esc(s.name)}" placeholder="${esc(L.namePh(i + 1))}" autocomplete="off" autocapitalize="words" enterkeyhint="next">
          <button class="iconbtn" data-act="setup-remove" data-i="${i}" aria-label="${L.remove}" ${d.sides.length <= 2 ? 'disabled' : ''}>×</button>
        </div>`).join('')}
      ${d.sides.length < 8 ? `<button class="addrow" data-act="setup-add">+ ${L.addSide}</button>` : ''}
      <p class="hint">${L.sidesHint}</p>
    </div>
    <div class="field">
      <span class="eyebrow">${L.target}</span>
      <div class="chips">${[11, 16, 21].map(v => `<button class="chip target-chip ${d.target === v ? 'on' : ''}" style="--c:var(--accent)" data-act="setup-target" data-v="${v}">${v}</button>`).join('')}</div>
    </div>
    <button class="btn primary block" data-act="setup-start">${L.start}</button>
    ${running ? `<p class="hint" style="text-align:center">${L.replaceWarn}</p>` : ''}
    ${S.sides.length ? `<button class="btn ghost" data-act="setup-cancel">${L.cancel}</button>` : ''}`;
}

function chips(cat, cur, allowTie) {
  const L = t();
  const pop = v => ui.picked && ui.picked[0] === cat && ui.picked[1] === v ? 'pop' : '';
  return `<div class="chips">${S.sides.map((s, i) => `<button class="chip ${cur === i ? 'on' : ''} ${pop(i)}" style="--c:${col(i)}" data-act="pick" data-cat="${cat}" data-v="${i}"><span class="check"></span>${esc(nameOf(i))}</button>`).join('')}
    ${allowTie ? `<button class="chip muted ${cur === 'tie' ? 'on' : ''} ${pop('tie')}" data-act="pick" data-cat="${cat}" data-v="tie"><span class="check"></span>${L.tie}</button>` : ''}</div>`;
}

function calcBlock() {
  const L = t();
  const { prim, winner } = primiera(ui.calc);
  const open = ui.calcCell;
  const cell = (i, si) => {
    const c = ui.calc[i][si], on = open && open[0] === i && open[1] === si;
    return `<button class="pcell ${c ? '' : 'empty'} ${on ? 'on' : ''}" data-act="pcell" data-i="${i}" data-s="${si}" aria-label="${esc(nameOf(i))} – ${L.suit[SUITS[si]]}">
      ${spr(SUITS[si], 1)}<span>${c ? `<b>${L.card[c]}</b><small>${PRIM_PTS[c]}</small>` : `<b>${L.none}</b>`}</span></button>`;
  };
  const picker = (i, si) => {
    const owner = c => ui.calc.findIndex((row, k) => k !== i && row[si] === c);
    return `<div class="picker" style="--c:${col(i)}">
      <p class="picker-title">${spr(SUITS[si], 1)}${esc(L.pickTitle(L.suit[SUITS[si]], nameOf(i)))}</p>
      <div class="picker-grid">${PRIM.map(([c, pts]) => {
        const o = owner(c), mine = ui.calc[i][si] === c;
        return `<button class="pcard-opt ${mine ? 'on' : ''}" data-act="pcard" data-i="${i}" data-s="${si}" data-v="${c}" ${o >= 0 ? `disabled title="${esc(nameOf(o))}"` : ''}>
          <b>${L.card[c]}</b><small>${L.cardIt[c] || ''}</small><em>${pts}</em>${o >= 0 ? `<i style="--c:${col(o)}"></i>` : ''}</button>`;
      }).join('')}
        <button class="pcard-opt none" data-act="pcard" data-i="${i}" data-s="${si}" data-v="">${L.noCard}</button>
      </div></div>`;
  };
  return `<div class="prim">${S.sides.map((s, i) => `
    <div class="prim-side ${winner === i ? 'best' : ''}" style="--c:${col(i)}">
      <div class="prim-top">${sw(col(i))}<span class="rname">${esc(nameOf(i))}</span><span class="prim-flag">${prim[i].touched && !prim[i].complete ? L.missingSuit : ''}</span><span class="prim-total">${prim[i].sum}</span></div>
      <div class="prim-grid">${SUITS.map((su, si) => cell(i, si)).join('')}</div>
      ${open && open[0] === i ? picker(i, open[1]) : ''}
    </div>`).join('')}
    <p class="prim-key">${L.primKey}</p></div>`;
}

function sheetView() {
  const L = t(), d = ui.draft, n = S.sides.length;
  const roundNo = ui.editIndex != null ? ui.editIndex + 1 : S.rounds.length + 1;
  const pts = scoreRound(d, n);
  const all = totals();
  const base = ui.editIndex != null ? all.map((v, i) => v - scoreRound(S.rounds[ui.editIndex], n)[i]) : all;
  const names = { carte: 'Carte', denari: 'Denari', settebello: 'Settebello', primiera: 'Primiera' };
  const openN = CATS.filter(k => d[k] == null).length;
  const warns = sanity(d, ui.calc, n).filter(([k]) => !ui.dismissed.includes(k));
  ui.curWarns = warns.map(([k]) => k);
  const cat = (key, sub, extra = '', tie = true, body = '') => `
    <section class="cat ${d[key] != null ? 'done' : ''}">
      <div class="cat-head"><div>${spr(CAT_ICON[key], 2)}<div><h3>${names[key]}</h3><span class="sub">${sub}</span></div></div>${extra}</div>
      ${chips(key, d[key], tie)}${body}
    </section>`;
  return `
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head"><h2>${ui.editIndex != null ? L.editRound(roundNo) : L.sheetTitle(roundNo)}</h2><button class="btn ghost" data-act="close-sheet">${L.close}</button></div>
  <div class="sheet-body ${ui.sheetEnter ? 'enter' : ''}" id="sheet-body">
    <section class="cat done scope-cat">
      <div class="cat-head"><div>${spr('broom', 2)}<div><h3>Scope</h3><span class="sub">${L.scopeSub}</span></div></div></div>
      <div class="rows">${S.sides.map((s, i) => `
        <div class="row">${sw(col(i))}<span class="rname">${esc(nameOf(i))}</span>
          <div class="stepper"><button data-act="scope" data-i="${i}" data-v="-1" aria-label="−">−</button><output class="${ui.stepIdx === i ? 'bump' : ''}">${d.scope[i]}</output><button data-act="scope" data-i="${i}" data-v="1" aria-label="+">+</button></div>
        </div>`).join('')}</div>
    </section>
    ${cat('carte', L.carteSub)}
    ${cat('denari', L.denariSub)}
    ${cat('settebello', L.settebelloSub, '', false)}
    ${cat('primiera', L.primieraSub, `<button class="link" data-act="calc">${ui.calc ? L.calcClose : L.calcOpen}</button>`, true, ui.calc ? calcBlock() : '')}
    ${ui.editIndex != null ? (ui.confirmDel
      ? `<div class="confirm"><span>${L.delSure}</span><button class="btn danger" data-act="del-yes">${L.yesDel}</button><button class="btn ghost" data-act="del-no">${L.cancel}</button></div>`
      : `<button class="btn ghost danger" data-act="del-round">${L.del}</button>`) : ''}
  </div>
  <div class="sheet-foot">
    ${warns.length ? `<div class="warns" role="status">${warns.map(([k, type, ...a]) => `<p class="warn ${ui.lastWarns?.includes(k) ? '' : 'in'}"><i aria-hidden="true">!</i><span>${esc(L.warn[type](...a))}</span><button data-act="warn-x" data-v="${k}" aria-label="${L.warnX}">✕</button></p>`).join('')}</div>` : ''}
    <div class="progress-row"><div class="progress" aria-hidden="true">${CATS.map((k, j) => `<i class="${d[k] != null ? 'done' : ''} ${d[k] != null && ui.lastDone && !ui.lastDone[j] ? 'new' : ''}"></i>`).join('')}</div><span class="${openN ? 'open' : 'ok'}">${openN ? L.stillOpen(openN) : L.allSet}</span></div>
    <div class="preview">${S.sides.map((s, i) => `<span style="--c:${col(i)}">${sw(col(i))}<em>${esc(nameOf(i))}</em><span class="tot">${base[i]}</span><span class="arrow">→</span><b class="${ui.bumpPrev && pts[i] !== ui.bumpPrev[i] ? 'bump' : ''}">${base[i] + pts[i]}</b>${pts[i] ? `<small>+${pts[i]}</small>` : ''}</span>`).join('')}</div>
    <button class="btn primary block" data-act="save-round">${ui.editIndex != null ? L.saveChanges : L.save}</button>
  </div>`;
}

    <p>Im Team sammeln die Partner ihre Stiche gemeinsam. Im Tracker legst du dann ein Team statt einzelner Spieler an.</p>
  </section>
  <section>
    <h3>Ein Zug</h3>
    <ul>
      <li>Spiele eine Karte aus. Liegt eine Karte <b>gleichen Werts</b> auf dem Tisch, nimmst du sie.</li>
      <li>Sonst kannst du mehrere Karten nehmen, deren <b>Summe</b> dem Wert entspricht: eine 7 nimmt 4 + 3.</li>
      <li>Geht beides, musst du die <b>einzelne Karte</b> nehmen.</li>
      <li>Kannst du nichts nehmen, bleibt deine Karte offen liegen.</li>
    </ul>
  </section>
  <section>
    <h3>Scopa</h3>
    <p>Nimmst du <b>alle Karten</b> vom Tisch, ist das eine Scopa und zählt 1 Punkt. Im Tracker tippst du dafür direkt auf <b>Scopa</b>. Der allerletzte Stich der Runde zählt nicht als Scopa. Wer zuletzt gestochen hat, bekommt die restlichen Tischkarten.</p>
  </section>
  <section>
    <h3>Wertung nach jeder Runde</h3>
    <div class="tbl"><table>
      <thead><tr><th>Punkt</th><th>Wer bekommt ihn?</th></tr></thead>
      <tbody>
        <tr><td><em>Carte</em></td><td>die meisten Karten (mehr als 20 bei zwei Seiten)</td></tr>
        <tr><td><em>Denari</em></td><td>die meisten Münzen</td></tr>
        <tr><td><em>Settebello</em></td><td>wer die Sieben der Münzen hat</td></tr>
        <tr><td><em>Primiera</em></td><td>der beste Satz, siehe unten</td></tr>
        <tr><td><em>Scope</em></td><td>1 Punkt pro Scopa</td></tr>
      </tbody></table></div>
    <p>Bei Gleichstand in Carte, Denari oder Primiera bekommt niemand den Punkt.</p>
  </section>
  <section>
    <h3>Primiera</h3>
    <p>Jeder nimmt aus seinen Stichen die <b>beste Karte jeder Farbe</b> und addiert deren Primiera-Werte. Die höchste Summe gewinnt. Hier ist die <b>7 am stärksten</b>, die Bildkarten am schwächsten.</p>
    <div class="cards">${PRIM.slice(0, 7).map(([c, v]) => `<div class="mini"><b>${t().card[c]}</b><span>${v}</span></div>`).join('')}<div class="mini wide"><b>${t().card.R} · ${t().card.C} · ${t().card.F}</b><span>${10}</span></div></div>
    <div class="example"><span><b>A:</b> 7 Denari, 7 Coppe, 6 Spade, Ass Bastoni = 21 + 21 + 18 + 16 = <b>76</b></span><span><b>B:</b> 7 Denari, Re Coppe, 5 Spade, 7 Bastoni = 21 + 10 + 15 + 21 = <b>67</b></span><span>A bekommt den Punkt.</span></div>
    <p>Meist ist es offensichtlich: wer mehr Siebener hat, dann mehr Sechser. Nur wenn es knapp ist, hilft der Rechner beim Werten. Wem eine Farbe fehlt, der kann die Primiera nicht gewinnen.</p>
  </section>
  <section>
    <h3>Sieg</h3>
    <p>Gespielt wird meist bis <b>11</b> (auch 16 oder 21). Erreichen mehrere das Ziel in derselben Runde, gewinnt der höhere Stand. Bei Gleichstand an der Spitze wird eine weitere Runde gespielt.</p>
  </section>
</div>`,
en: () => `
<div class="rules">
  <section>
    <span class="eyebrow">Regole della Scopa</span>
    <h2>How to play Scopa</h2>
    <p class="lede">Capture cards from the table, sweep it clean when you can, and collect points after each round. First to 11 points wins.</p>
  </section>
  <section>
    <h3>The deck</h3>
    <p>An Italian deck of <b>40 cards</b> in four suits. Each suit has ace to 7 plus <b>Fante</b> (jack, 8), <b>Cavallo</b> (knight, 9) and <b>Re</b> (king, 10).</p>
    <div class="suitlist">
      <div>${spr('denari', 2)}<p><b>Denari</b><span>Coins</span></p></div>
      <div>${spr('coppe', 2)}<p><b>Coppe</b><span>Cups</span></p></div>
      <div>${spr('spade', 2)}<p><b>Spade</b><span>Swords</span></p></div>
      <div>${spr('bastoni', 2)}<p><b>Bastoni</b><span>Clubs</span></p></div>
    </div>
    <p>With a French deck: remove the 8s, 9s and 10s. Diamonds then count as coins.</p>
  </section>
  <section>
    <h3>Dealing</h3>
    <p>Everyone gets <b>3 cards</b> and <b>4 cards</b> go face up on the table. When all hands are empty, the dealer deals 3 more to each player. No new cards go to the table until the deck runs out.</p>
    <div class="tbl"><table>
      <thead><tr><th>Players</th><th>Format</th><th>Deals per round</th></tr></thead>
      <tbody>
        <tr><td>2</td><td>everyone for themselves</td><td>6 ×</td></tr>
        <tr><td>3</td><td>everyone for themselves</td><td>4 ×</td></tr>
        <tr><td>4</td><td>2 teams of 2, partners opposite</td><td>3 ×</td></tr>
        <tr><td>6</td><td>3 teams of 2 or 2 teams of 3</td><td>2 ×</td></tr>
      </tbody></table></div>
    <p>Partners pool their captured cards. In the tracker, add a team instead of individual players.</p>
  </section>
  <section>
    <h3>A turn</h3>
    <ul>
      <li>Play one card. If a card of the <b>same value</b> is on the table, take it.</li>
      <li>Otherwise you can take several cards that <b>add up</b> to its value: a 7 takes 4 + 3.</li>
      <li>If both are possible, you must take the <b>single card</b>.</li>
      <li>If you can’t capture, your card stays face up on the table.</li>
    </ul>
  </section>
  <section>
    <h3>Scopa</h3>
    <p>Taking <b>every card</b> on the table is a scopa (sweep) and scores 1 point. In the tracker, tap <b>Scopa</b> right when it happens. The very last capture of a round doesn’t count as a scopa. Whoever captured last takes the cards left on the table.</p>
  </section>
  <section>
    <h3>Scoring each round</h3>
    <div class="tbl"><table>
      <thead><tr><th>Point</th><th>Who gets it</th></tr></thead>
      <tbody>
        <tr><td><em>Carte</em></td><td>most cards (more than 20 with two sides)</td></tr>
        <tr><td><em>Denari</em></td><td>most coins</td></tr>
        <tr><td><em>Settebello</em></td><td>whoever has the seven of coins</td></tr>
        <tr><td><em>Primiera</em></td><td>the best set, see below</td></tr>
        <tr><td><em>Scope</em></td><td>1 point per sweep</td></tr>
      </tbody></table></div>
    <p>If Carte, Denari or Primiera is tied, nobody gets that point.</p>
  </section>
  <section>
    <h3>Primiera</h3>
    <p>Each side takes its <b>best card in every suit</b> from its captures and adds up their primiera values. The highest total wins. Here the <b>7 is the strongest</b> card and face cards are the weakest.</p>
    <div class="cards">${PRIM.slice(0, 7).map(([c, v]) => `<div class="mini"><b>${t().card[c]}</b><span>${v}</span></div>`).join('')}<div class="mini wide"><b>${t().card.R} · ${t().card.C} · ${t().card.F}</b><span>${10}</span></div></div>
    <div class="example"><span><b>A:</b> 7 coins, 7 cups, 6 swords, ace of clubs = 21 + 21 + 18 + 16 = <b>76</b></span><span><b>B:</b> 7 coins, king of cups, 5 swords, 7 clubs = 21 + 10 + 15 + 21 = <b>67</b></span><span>A gets the point.</span></div>
    <p>Usually it’s obvious: whoever has more 7s, then more 6s. Only when it’s close does the calculator help. A side missing a suit can’t win the primiera.</p>
  </section>
  <section>
    <h3>Winning</h3>
    <p>Games usually go to <b>11</b> (sometimes 16 or 21). If several sides pass the target in the same round, the higher score wins. If the leaders are tied, play another round.</p>
  </section>
</div>`
};


/* ---------- render ---------- */
function render() {
  const L = t();
  document.documentElement.lang = S.lang;
  document.getElementById('lang').dataset.v = S.lang;
  document.getElementById('lang-de').classList.toggle('on', S.lang === 'de');
  document.getElementById('lang-en').classList.toggle('on', S.lang === 'en');
  document.getElementById('tabs').dataset.v = ui.tab;
  document.getElementById('tab-game').classList.toggle('on', ui.tab === 'game');
  document.getElementById('tab-rules').classList.toggle('on', ui.tab === 'rules');
  document.getElementById('tab-game-l').textContent = L.game;
  document.getElementById('tab-rules-l').textContent = L.rules;

  const key = ui.tab === 'rules' ? 'rules-' + S.lang : ui.setup ? 'setup' : 'game';
  const view = document.getElementById('view');
  const toRules = key.startsWith('rules'), wasRules = ui.viewKey.startsWith('rules');
  const dir = toRules && !wasRules ? ' from-r' : !toRules && wasRules ? ' from-l' : '';
  view.className = 'stack' + (key !== ui.viewKey ? ' enter' + dir : '');
  view.innerHTML = ui.tab === 'rules' ? RULES[S.lang]() : ui.setup ? setupView() : gameView();
  ui.viewKey = key;
  ui.popIdx = -1;

  if (key === 'game') animateScores();
  syncWakeLock();
}

function animateScores() {
  const tot = totals();
  const changed = ui.shownTot && ui.shownTot.length === tot.length ? tot.map((v, i) => v !== ui.shownTot[i]) : tot.map(() => false);
  ui.shownTot = tot;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    tot.forEach((v, i) => {
      const bar = document.getElementById('bar-' + i);
      if (bar) bar.style.width = bar.dataset.to + '%';
      const el = document.getElementById('score-' + i);
      if (!el) return;
      if (!changed[i]) { el.textContent = v; return; }
      if (v > +el.dataset.from) document.getElementById('pcard-' + i)?.classList.add('gain');
      const from = +el.dataset.from, to = v, t0 = performance.now(), dur = 450;
      el.classList.add('bump');
      const step = now => {
        const p = Math.min(1, (now - t0) / dur);
        el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }));
}

function renderSheet() {
  const panel = document.getElementById('sheet-panel');
  const before = ui.lastPts;
  const prev = document.getElementById('sheet-body')?.scrollTop || 0;
  ui.bumpPrev = before;
  panel.innerHTML = sheetView();
  document.getElementById('sheet-body').scrollTop = prev;
  ui.lastPts = scoreRound(ui.draft, S.sides.length);
  ui.lastDone = CATS.map(k => ui.draft[k] != null);
  ui.picked = null; ui.stepIdx = -1; ui.sheetEnter = false; ui.bumpPrev = null; ui.lastWarns = ui.curWarns;
}
function openSheet(draft, editIndex) {
  ui.draft = draft; ui.editIndex = editIndex; ui.confirmDel = false; ui.calc = null; ui.calcCell = null; ui.sheetEnter = true; ui.lastPts = null; ui.lastDone = null; ui.dismissed = []; ui.lastWarns = null;
  const sheet = document.getElementById('sheet');
  renderSheet();
  document.getElementById('sheet-body').scrollTop = 0;
  sheet.hidden = false;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
}
function closeSheet() {
  const sheet = document.getElementById('sheet');
  ui.draft = null;
  sheet.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { if (!ui.draft) sheet.hidden = true; }, 380);
}

let toastTimer;
function toast(msg, withUndo) {
  const el = document.getElementById('toast'), btn = document.getElementById('toast-btn');
  document.getElementById('toast-msg').textContent = msg;
  btn.hidden = !withUndo; btn.textContent = t().undoBtn;
  if (!withUndo) ui.undo = null;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); ui.undo = null; }, withUndo ? 5000 : 2200);
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  box.innerHTML = Array.from({ length: 48 }, (_, k) => `<i style="left:${Math.random() * 100}%;--c:var(--s${k % 4 + 1});--d:${1.6 + Math.random() * 1.4}s;--delay:${Math.random() * .5}s;--dx:${(Math.random() - .5) * 120}px;--r:${(Math.random() - .5) * 720}deg"></i>`).join('');
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3800);
}

function scopaFx(i) {
  const card = document.getElementById('pcard-' + i);
  if (!card) return;
  card.classList.add('flash');
  card.querySelector('.addscopa')?.classList.add('sweep');
  const f = document.createElement('span');
  f.className = 'floater'; f.textContent = '+1';
  card.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

/* keep the screen on while a game is on the table */
let wakeLock = null;
async function syncWakeLock() {
  const want = ui.tab === 'game' && !ui.setup && S.sides.length && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
document.addEventListener('visibilitychange', syncWakeLock);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, i = +el.dataset.i;
  const d = ui.draft, L = t();
  switch (act) {
    case 'lang': S.lang = v; persist(); render(); if (ui.draft) renderSheet(); return;
    case 'tab': if (ui.tab === v) return; ui.tab = v; render(); window.scrollTo(0, 0); return;
    case 'scopa': S.live[i] = (S.live[i] || 0) + 1; ui.popIdx = i; persist(); render(); scopaFx(i); return;
    case 'unscopa': S.live[i] = Math.max(0, (S.live[i] || 0) - 1); persist(); render(); return;
    case 'new-game': ui.setup = { sides: S.sides.map(s => ({ ...s })), target: S.target }; ui.tab = 'game'; render(); window.scrollTo(0, 0); return;
    case 'rematch': S.rounds = []; S.live = S.sides.map(() => 0); ui.shownTot = null; persist(); render(); return;
    case 'setup-add': {
      const used = ui.setup.sides.map(s => s.color);
      let c = 0; while (used.includes(c) && c < COLORS - 1) c++;
      ui.setup.sides.push({ name: '', color: c }); render();
      document.getElementById(`setup-name-${ui.setup.sides.length - 1}`)?.focus();
      return;
    }
    case 'setup-remove': ui.setup.sides.splice(i, 1); render(); return;
    case 'setup-color': ui.setup.sides[i].color = (ui.setup.sides[i].color + 1) % COLORS; render(); return;
    case 'setup-target': ui.setup.target = +v; render(); return;
    case 'setup-cancel': ui.setup = null; render(); return;
    case 'setup-start':
      S = { lang: S.lang, target: ui.setup.target, sides: ui.setup.sides.map((s, k) => ({ name: s.name.trim() || L.namePh(k + 1), color: s.color })), rounds: [], live: ui.setup.sides.map(() => 0) };
      ui.setup = null; ui.shownTot = null; persist(); render(); window.scrollTo(0, 0); return;
    case 'open-round': openSheet(blankRound(S.sides.length, S.live), null); return;
    case 'edit-round': openSheet(JSON.parse(JSON.stringify(S.rounds[i])), i); return;
    case 'close-sheet': closeSheet(); return;
    case 'scope': d.scope[i] = Math.max(0, d.scope[i] + +v); ui.stepIdx = i; renderSheet(); return;
    case 'pick': { const val = v === 'tie' ? 'tie' : +v, cat = el.dataset.cat; d[cat] = d[cat] === val ? null : val; ui.picked = [cat, val]; renderSheet(); return; }
    case 'calc': ui.calc = ui.calc ? null : S.sides.map(() => ['', '', '', '']); ui.calcCell = ui.calc ? [0, 0] : null; renderSheet(); return;
    case 'pcell': ui.calcCell = ui.calcCell && ui.calcCell[0] === i && ui.calcCell[1] === +el.dataset.s ? null : [i, +el.dataset.s]; renderSheet(); return;
    case 'pcard': {
      const si = +el.dataset.s;
      ui.calc[i][si] = v;
      // the best coin being the 7 means this side holds the settebello
      if (si === 0 && v === '7' && d.settebello == null) { d.settebello = i; ui.picked = ['settebello', i]; }
      const next = ui.calc[i].findIndex((c, k) => k > si && !c);
      ui.calcCell = next >= 0 ? [i, next] : (i + 1 < S.sides.length && ui.calc[i + 1].some(c => !c) ? [i + 1, ui.calc[i + 1].findIndex(c => !c)] : null);
      const { winner } = primiera(ui.calc);
      if (winner != null) { d.primiera = winner; ui.picked = ['primiera', winner]; }
      renderSheet(); return;
    }
    case 'save-round': {
      const before = JSON.stringify(S);
      const wasOver = gameResult(totals())?.winner != null;
      const no = ui.editIndex != null ? ui.editIndex + 1 : S.rounds.length + 1;
      if (ui.editIndex != null) S.rounds[ui.editIndex] = d;
      else { S.rounds.push(d); S.live = S.sides.map(() => 0); }
      persist(); closeSheet(); render();
      ui.undo = before; toast(L.saved(no), true);
      if (!wasOver && gameResult(totals())?.winner != null) { window.scrollTo({ top: 0, behavior: 'smooth' }); confetti(); }
      return;
    }
    case 'toast-undo': if (ui.undo) { S = JSON.parse(ui.undo); ui.undo = null; persist(); render(); toast(L.undone, false); } return;
    case 'warn-x': ui.dismissed.push(v); renderSheet(); return;
    case 'del-round': ui.confirmDel = true; renderSheet(); return;
    case 'del-no': ui.confirmDel = false; renderSheet(); return;
    case 'del-yes': { const before = JSON.stringify(S); S.rounds.splice(ui.editIndex, 1); persist(); closeSheet(); render(); ui.undo = before; toast(L.deleted, true); return; }
  }
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && ui.draft) closeSheet();
  if (e.key === 'Enter' && e.target.dataset.in === 'setup-name') {
    e.preventDefault();
    const next = document.getElementById(`setup-name-${+e.target.dataset.i + 1}`);
    next ? next.focus() : e.target.blur();
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'setup-name') ui.setup.sides[+el.dataset.i].name = el.value;
});


document.getElementById('tab-game-i').innerHTML = spr('tabGame', 4 / 3);
document.getElementById('tab-rules-i').innerHTML = spr('tabRules', 4 / 3);
render();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // Reload once when a new version takes over, and look for one whenever the app comes back to the foreground.
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}
})();
</script>
